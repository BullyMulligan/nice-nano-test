# Onmi44 v3 - shared configuration for both halves (ZMK_CONFIG = config/).
#
# Auto-center: measure stick resting position at boot and use it as the
# effective center (overrides x-center/y-center from devicetree). Keep the
# sticks untouched while powering on. This fixes cursor drift when the real
# potentiometer rest position differs from the nominal 1872.
CONFIG_ZMK_ANALOG_STICK_AUTO_CENTER=y
#
# The analog stick driver and battery reporting both use the nRF SAADC.
# They are serialized by the Zephyr adc_context lock, so both can stay on.
# If the stick ever stops after ~1 minute of use, rule out the battery by
# uncommenting the line below and rebuilding:
#CONFIG_ZMK_BATTERY_REPORTING=n
